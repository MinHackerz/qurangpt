<!DOCTYPE html>
<html>
<head>
    <title>PWA Icon Generator</title>
</head>
<body>
    <canvas id="canvas" style="border: 1px solid #ccc;"></canvas>
    <br><br>
    <button onclick="generateAllIcons()">Generate All Icons</button>
    <div id="downloads"></div>

    <script>
        const iconSizes = [16, 32, 72, 96, 128, 144, 152, 192, 384, 512];
        
        function generateIcon(size) {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = size;
            canvas.height = size;
            
            // Clear canvas
            ctx.clearRect(0, 0, size, size);
            
            // Create gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#10b981');
            gradient.addColorStop(1, '#059669');
            
            // Background circle
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(size/2, size/2, size/2 - 2, 0, 2 * Math.PI);
            ctx.fill();
            
            // White border
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Book rectangle
            const bookWidth = size * 0.5;
            const bookHeight = size * 0.6;
            const bookX = (size - bookWidth) / 2;
            const bookY = size * 0.2;
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.fillRect(bookX, bookY, bookWidth, bookHeight);
            
            // Book lines
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = Math.max(1, size / 32);
            const lineY1 = bookY + bookHeight * 0.25;
            const lineY2 = bookY + bookHeight * 0.45;
            const lineY3 = bookY + bookHeight * 0.65;
            const lineY4 = bookY + bookHeight * 0.85;
            const lineX1 = bookX + bookWidth * 0.1;
            const lineX2 = bookX + bookWidth * 0.9;
            
            ctx.beginPath();
            ctx.moveTo(lineX1, lineY1);
            ctx.lineTo(lineX2, lineY1);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(lineX1, lineY2);
            ctx.lineTo(lineX2, lineY2);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(lineX1, lineY3);
            ctx.lineTo(lineX2, lineY3);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(lineX1, lineY4);
            ctx.lineTo(lineX2, lineY4);
            ctx.stroke();
            
            // Crescent moon
            const moonX = size * 0.6;
            const moonY = size * 0.15;
            const moonRadius = size * 0.05;
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(moonX, moonY, moonRadius, 0, 2 * Math.PI);
            ctx.fill();
            
            // Star
            const starX = size * 0.6;
            const starY = size * 0.1;
            const starRadius = size * 0.04;
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                const angle = (i * 4 * Math.PI) / 5;
                const x = starX + Math.cos(angle) * starRadius;
                const y = starY + Math.sin(angle) * starRadius;
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.closePath();
            ctx.fill();
        }
        
        function downloadIcon(size) {
            const canvas = document.getElementById('canvas');
            const link = document.createElement('a');
            link.download = `icon-${size}x${size}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }
        
        function generateAllIcons() {
            const downloadsDiv = document.getElementById('downloads');
            downloadsDiv.innerHTML = '';
            
            iconSizes.forEach((size, index) => {
                setTimeout(() => {
                    generateIcon(size);
                    downloadIcon(size);
                    
                    const status = document.createElement('div');
                    status.textContent = `Generated icon-${size}x${size}.png`;
                    downloadsDiv.appendChild(status);
                }, index * 500);
            });
        }
        
        // Generate initial icon
        generateIcon(512);
    </script>
</body>
</html>
